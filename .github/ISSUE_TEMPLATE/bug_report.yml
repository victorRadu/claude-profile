name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `claude-profile version`
      placeholder: claude-profile v0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and shell
      placeholder: macOS 15 / zsh
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what did you get?
    validations:
      required: true
  - type: textarea
    id: managed-block
    attributes:
      label: Managed block (if alias-related)
      description: The lines between `# >>> claude-profile >>>` and `# <<< claude-profile <<<` in your shell startup file.
      render: shell
